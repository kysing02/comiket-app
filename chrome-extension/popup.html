<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0b;
            color: white;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo {
            width: 24px;
            height: 24px;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .content-preview {
            font-size: 12px;
            color: #a1a1aa;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .image-count {
            font-size: 11px;
            color: #6366f1;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #6366f1;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon128.png" class="logo">
        <h2>Comiket Helper</h2>
    </div>

    <div id="preview" style="display: none;">
        <div class="card">
            <div id="tweetText" class="content-preview"></div>
            <div id="imageCount" class="image-count"></div>
        </div>
        <button id="sendBtn">Add to Feed</button>
    </div>

    <div id="noTweet" style="text-align: center; color: #a1a1aa; font-size: 13px;">
        No tweet detected.<br>Open an X post.
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>

</html>
